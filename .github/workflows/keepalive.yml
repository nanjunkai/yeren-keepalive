# ============================================================
# 野人动态监控 · 云端保活心跳
# ============================================================
# 作用：定时敲一次监控服务的免鉴权探针，防止云沙箱因
#       “长时间无入站流量”被平台回收，导致早盘动态延迟推送。
#
# 放置位置：仓库根目录下  .github/workflows/keepalive.yml
#
# 【重要】网址不写在本文件里，而是存在仓库 Secret 中：
#   仓库页 → Settings → Secrets and variables → Actions
#   → New repository secret
#       Name : PING_URL
#       Value: 你的探针完整地址（形如 https://<服务域名>/api/ping）
#              ——具体地址见部署说明，切勿写回本文件
#   这样即使仓库是公开的，别人也看不到你的服务地址。
#
# 前置条件：仓库用【Public 公共仓库】——公共仓库的 Actions 免费且
#           不限时长；私有仓库免费额度只有 2000 分钟/月，按本文件
#           的频率（每 5 分钟一次）会超支约 4 倍。
#           Secret 机制对公开仓库同样安全：别人 fork 你的仓库跑
#           workflow 也拿不到你的 Secret。
#
# 实测记录（2026-09-21 首次配置）：
#   手动触发两次。第 1 次 25 秒超时失败（服务冷启动 + 网络抖动），
#   第 2 次成功；服务侧 access 日志确认收到 ua=curl/8.5.0 的请求
#   （GitHub runner 的 curl 版本，与本机 8.7.1 可区分）。
#   ⇒ 故此处采用「30 秒超时 × 最多 3 次重试」，覆盖冷启动与抖动。
# ============================================================

name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟一次（GitHub 允许的最短间隔）
  workflow_dispatch:        # 同时支持在 Actions 页面手动点一下测试

permissions:
  contents: write           # 仅供下方“保活提交”使用

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 敲一下探针
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "::error::未配置 PING_URL 密钥，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PING_URL")
            echo "第 $i 次: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "保活探针成功"
              exit 0
            fi
            sleep 5
          done
          echo "::error::连续 3 次未拿到 200，请检查服务是否在线"
          exit 1

      - uses: actions/checkout@v4

      - name: 每天留一次活动记录，避免 60 天不活动被自动停用
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M)
          if [ "$H" = "04" ] && [ "$M" -lt 5 ]; then
            date -u +%F > .keepalive
            git config user.name  "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive $(date -u +%F)" || exit 0
            git push
          else
            echo "非保活时段，跳过提交（正常）"
          fi
