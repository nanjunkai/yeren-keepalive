name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 敲一下探针
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "::error::未配置 PING_URL 密钥"
            exit 1
          fi
          echo "URL 长度: ${#PING_URL}"
          HOST=$(echo "$PING_URL" | sed -E 's|https?://([^/]+).*|\1|')
          echo "目标主机: $HOST"
          echo "--- DNS 解析 ---"
          getent hosts "$HOST" || echo "(getent 无结果)"
          echo "--- curl 详细过程 ---"
          curl -sS -v -o /dev/null --max-time 25 "$PING_URL" 2>&1 | tail -25 || true
          echo "--- 最终判定 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$PING_URL")
          echo "HTTP code=$code"
          test "$code" = "200"

      - uses: actions/checkout@v4

      - name: 每天留一次活动记录，避免 60 天不活动被自动停用
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M)
          if [ "$H" = "04" ] && [ "$M" -lt 5 ]; then
            date -u +%F > .keepalive
            git config user.name  "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive $(date -u +%F)" || exit 0
            git push
          else
            echo "非保活时段，跳过提交（正常）"
          fi
